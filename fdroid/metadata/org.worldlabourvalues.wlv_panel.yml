Categories:
  - Science & Education
License: GPL-3.0-only
WebSite: https://worldlabourvalues.org
SourceCode: https://github.com/DistintiveLab/wlvapp
IssueTracker: https://github.com/DistintiveLab/wlvapp/issues
Changelog: https://github.com/DistintiveLab/wlvapp/releases
Repo: https://github.com/DistintiveLab/wlvapp.git
RepoType: git
AutoName: WLVD
Description: |-
  The World Labour Values Database (WLVD) provides estimates of labour values,
  prices of production and related indicators computed from national
  input-output tables.

  This app is a lightweight native wrapper around the official WLVD panel
  (worldlabourvalues.org):

  - Explore the map, country, indicators, trade and download tabs
  - Download data spreadsheets (XLSX/CSV) to a local folder with quick offline
    access
  - Pull-to-refresh, share the current page and open external links in the
    system browser
  - Remembers your language and last visited tab

  The panel behaviour lives on the web; the wrapper adds native conveniences on
  top of it. All source code is available under GPL-3.0.

Builds:
  - versionName: '1.0.0'
    versionCode: 1
    commit: v1.0.0
    sudo:
      - echo "deb https://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install -y -t bookworm openjdk-17-jdk-headless
      - update-java-alternatives -s java-1.17.0-openjdk-amd64
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.3.10
    rm:
      - ios
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: '1.0.0'
CurrentVersionCode: 1
