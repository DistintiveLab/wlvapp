Categories:
  - Science & Education
License: GPL-3.0-only
AuthorName: Rodrigo Borges
WebSite: https://worldlabourvalues.org
SourceCode: https://github.com/DistintiveLab/wlvapp
IssueTracker: https://github.com/DistintiveLab/wlvapp/issues
Changelog: https://github.com/DistintiveLab/wlvapp/releases
Repo: https://github.com/DistintiveLab/wlvapp.git
RepoType: git
AutoName: WLVD
Builds:
  - versionName: '1.0.1'
    versionCode: 2
    commit: f1e76c2dddf23ea93c4d19d6ca1db685db1e005f
    sudo:
      - echo "deb https://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install -y -t bookworm openjdk-17-jdk-headless
      - update-java-alternatives -s java-1.17.0-openjdk-amd64
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.3.10
    rm:
      - ios
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: '1.0.1'
CurrentVersionCode: 2
